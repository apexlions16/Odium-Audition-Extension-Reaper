name: Build REAPER distributions

on:
  push:
    branches: [main]
    paths:
      - 'reaper/**'
      - '.github/workflows/build-reaper-windows.yml'
  pull_request:
    branches: [main]
    paths:
      - 'reaper/**'
      - '.github/workflows/build-reaper-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reaper-distribution-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION: '2.1.2'
  RELEASE_TAG: 'v2.1.2'

jobs:
  windows:
    name: Windows one-click installer
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Fetch pinned ReaImGui Windows runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & 'reaper\tools\Fetch-ReaImGui.ps1' -Dest 'reaper\vendor\reaimgui' -Platform windows

      - name: Compile Windows installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe bulunamadı: $iscc" }
          & $iscc 'reaper\installer\OdiumReaper.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup derlemesi başarısız: $LASTEXITCODE" }
          $setup = 'reaper\dist\Odium-REAPER-Windows-Setup.exe'
          if (-not (Test-Path $setup)) { throw "Setup üretilmedi: $setup" }
          if ((Get-Item $setup).Length -lt 1024) { throw 'Setup şüpheli derecede küçük.' }
          Get-FileHash $setup -Algorithm SHA256 | Format-List

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: odium-reaper-windows
          path: reaper/dist/Odium-REAPER-Windows-Setup.exe
          if-no-files-found: error
          retention-days: 30

  manual-packages:
    name: macOS and Linux manual packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch pinned ReaImGui macOS and Linux runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./reaper/tools/Fetch-ReaImGui.ps1 -Dest 'reaper/vendor/reaimgui' -Platform macos
          ./reaper/tools/Fetch-ReaImGui.ps1 -Dest 'reaper/vendor/reaimgui' -Platform linux

      - name: Stage manual packages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf reaper/dist/stage
          MAC='reaper/dist/stage/macos/Odium REAPER'
          LIN='reaper/dist/stage/linux/Odium REAPER'

          for stage in "$MAC" "$LIN"; do
            mkdir -p "$stage/lib" "$stage/vendor/reaimgui/api" "$stage/THIRD_PARTY_LICENSES"
            cp reaper/Odium_Reaper_Launcher.lua "$stage/"
            cp reaper/Odium_Reaper_Extension.lua "$stage/"
            cp reaper/Odium_Check_For_Updates.lua "$stage/"
            cp reaper/Register-Odium.lua "$stage/"
            cp reaper/Unregister-Odium.lua "$stage/"
            cp reaper/README.md "$stage/"
            cp reaper/THIRD_PARTY_NOTICES.md "$stage/"
            cp reaper/version.json "$stage/"
            cp reaper/lib/*.lua "$stage/lib/"
            cp reaper/vendor/reaimgui/VERSION.txt "$stage/vendor/reaimgui/"
            cp reaper/vendor/reaimgui/api/imgui.lua "$stage/vendor/reaimgui/api/"
            cp reaper/vendor/reaimgui/licenses/* "$stage/THIRD_PARTY_LICENSES/"
          done

          mkdir -p "$MAC/platform/macos" "$LIN/platform/linux"
          cp reaper/platform/macos/* "$MAC/platform/macos/"
          cp reaper/platform/linux/* "$LIN/platform/linux/"
          chmod +x "$MAC/platform/macos/install.command" "$LIN/platform/linux/install.sh"

          cp reaper/vendor/reaimgui/reaper_imgui-arm64.dylib "$MAC/vendor/reaimgui/"
          cp reaper/vendor/reaimgui/reaper_imgui-x86_64.dylib "$MAC/vendor/reaimgui/"
          cp reaper/vendor/reaimgui/reaper_imgui-i386.dylib "$MAC/vendor/reaimgui/"

          cp reaper/vendor/reaimgui/reaper_imgui-x86_64.so "$LIN/vendor/reaimgui/"
          cp reaper/vendor/reaimgui/reaper_imgui-aarch64.so "$LIN/vendor/reaimgui/"
          cp reaper/vendor/reaimgui/reaper_imgui-i686.so "$LIN/vendor/reaimgui/"
          cp reaper/vendor/reaimgui/reaper_imgui-armv7l.so "$LIN/vendor/reaimgui/"

      - name: Build macOS ZIP and Linux tar.gz
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reaper/dist
          (cd reaper/dist/stage/macos && zip -r -9 ../../Odium-REAPER-macOS-manual.zip 'Odium REAPER')
          tar -C reaper/dist/stage/linux -czf reaper/dist/Odium-REAPER-Linux-manual.tar.gz 'Odium REAPER'
          test -s reaper/dist/Odium-REAPER-macOS-manual.zip
          test -s reaper/dist/Odium-REAPER-Linux-manual.tar.gz
          sha256sum reaper/dist/Odium-REAPER-macOS-manual.zip reaper/dist/Odium-REAPER-Linux-manual.tar.gz

      - name: Upload manual package artifact
        uses: actions/upload-artifact@v4
        with:
          name: odium-reaper-manual-packages
          path: |
            reaper/dist/Odium-REAPER-macOS-manual.zip
            reaper/dist/Odium-REAPER-Linux-manual.tar.gz
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release assets
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [windows, manual-packages]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: odium-reaper-windows
          path: release-assets

      - name: Download manual package artifact
        uses: actions/download-artifact@v4
        with:
          name: odium-reaper-manual-packages
          path: release-assets

      - name: Generate checksums and release manifest
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum \
            Odium-REAPER-Windows-Setup.exe \
            Odium-REAPER-macOS-manual.zip \
            Odium-REAPER-Linux-manual.tar.gz > SHA256SUMS.txt
          cd ..
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          root = Path('release-assets')
          manifest = json.loads(Path('reaper/version.json').read_text(encoding='utf-8'))
          names = {
              'setupSha256': 'Odium-REAPER-Windows-Setup.exe',
              'macosSha256': 'Odium-REAPER-macOS-manual.zip',
              'linuxSha256': 'Odium-REAPER-Linux-manual.tar.gz',
          }
          for key, name in names.items():
              manifest[key] = hashlib.sha256((root / name).read_bytes()).hexdigest()
          (root / 'version.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )
          PY
          cat release-assets/SHA256SUMS.txt
          python -m json.tool release-assets/version.json >/dev/null

      - name: Write release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          # Odium Studio REAPER v2.1.2

          Pencere görünürlüğü ve stale "çalışıyor" durumu hotfix'i:

          - Launcher artık sadece Action toggle state'e güvenmez; yaşayan UI her frame kısa süreli bir lease/heartbeat yeniler.
          - Crash/abort sonrası kalan sahte "Odium zaten açık" durumu lease süresi dolunca otomatik temizlenir.
          - Odium gerçekten açıksa Action'a ikinci kez basmak yeni context açmaz; mevcut pencereye focus isteği yollar.
          - Pencere başka monitörde veya ekran dışında kaldıysa REAPER'ın ana viewport'una geri taşınır ve collapse durumundan çıkarılır.
          - v2.1.1 eski raw Action / End() koruması ve Adobe Audition `.sesx` + medya + ZIP teslim akışı korunur.

          Dağıtımlar:
          - `Odium-REAPER-Windows-Setup.exe` — Windows otomatik kurucu.
          - `Odium-REAPER-macOS-manual.zip` — Apple Silicon, Intel x86_64 ve eski i386 için manuel paket.
          - `Odium-REAPER-Linux-manual.tar.gz` — x86_64, aarch64, i686 ve armv7l için manuel paket.
          - `version.json` ve `SHA256SUMS.txt` — güncelleme ve bütünlük manifestleri.

          Uyumluluk hedefi REAPER 6.80+; ReaImGui 0.10.0.5 sabitlenmiştir.
          EOF

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Odium REAPER v$VERSION" --notes-file release-notes.md --latest
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Odium REAPER v$VERSION" --notes-file release-notes.md --latest
          fi
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            release-assets/Odium-REAPER-Windows-Setup.exe \
            release-assets/Odium-REAPER-macOS-manual.zip \
            release-assets/Odium-REAPER-Linux-manual.tar.gz \
            release-assets/version.json \
            release-assets/SHA256SUMS.txt
