name: REAPER Lua and distribution checks

on:
  push:
    paths:
      - 'reaper/**'
      - '.github/workflows/reaper-checks.yml'
  pull_request:
    paths:
      - 'reaper/**'
      - '.github/workflows/reaper-checks.yml'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Parse Lua files
        run: |
          find reaper -name '*.lua' -print0 | xargs -0 -n1 luac -p

      - name: Run pure Lua smoke tests
        run: lua reaper/tests/test_core.lua

      - name: Validate ReaImGui 0.10 compatibility layer
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -F 'ImGui.PushFont(ctx,font)' reaper --include='*.lua'; then
            echo 'ReaImGui 0.10 PushFont requires an explicit font size argument.' >&2
            exit 1
          fi
          grep -q -F 'ImGui.PushFont(ctx,font,15)' reaper/Odium_Reaper_Extension.lua
          grep -q -F "local main_script = join(root, 'Odium_Reaper_Launcher.lua')" reaper/Register-Odium.lua
          grep -q -F 'GetToggleCommandStateEx' reaper/Odium_Reaper_Launcher.lua
          grep -q -F 'if visible then return real.End(ctx) end' reaper/Odium_Reaper_Launcher.lua
          # v2.1.1: Eski raw Action kaydı da kendi başına güvenli çalışmalı ve launcher'a taşınmalı.
          grep -q -F "core.basename(filename) == 'Odium_Reaper_Extension.lua'" reaper/lib/odium_package.lua
          grep -q -F 'install_direct_imgui_compat()' reaper/lib/odium_package.lua
          grep -q -F 'migrate_legacy_action_to_launcher()' reaper/lib/odium_package.lua
          grep -q -F "pcall(reaper.AddRemoveReaScript, false, 0, legacy, true)" reaper/lib/odium_package.lua

      - name: Validate Windows upgrade Action List repair
        shell: bash
        run: |
          set -euo pipefail
          grep -q -F '#define AppVersion "2.1.1"' reaper/installer/OdiumReaper.iss
          grep -q -F 'Register-Odium.lua' reaper/installer/OdiumReaper.iss
          if grep -F 'Register-Odium.lua' reaper/installer/OdiumReaper.iss | grep -F 'Tasks: register'; then
            echo 'Register-Odium.lua must run unconditionally on upgrades; Tasks: register is not allowed.' >&2
            exit 1
          fi
          if grep -F 'Name: "register"' reaper/installer/OdiumReaper.iss | grep -F 'checkedonce'; then
            echo 'Registration must not be a checkedonce task.' >&2
            exit 1
          fi

      - name: Validate Audition SESX delivery integration
        shell: bash
        run: |
          set -euo pipefail
          test -s reaper/lib/odium_sesx.lua
          grep -q -F "return core.make_audition_package" reaper/lib/odium_package.lua
          grep -q -F "'ORIGINAL_REF'" reaper/lib/odium_sesx.lua
          grep -q -F "'DUB_TAKE'" reaper/lib/odium_sesx.lua
          grep -q -F 'Odium_Reaper_Launcher.lua' reaper/installer/OdiumReaper.iss
          grep -q -F 'Odium_Reaper_Launcher.lua' reaper/platform/macos/install.command
          grep -q -F 'Odium_Reaper_Launcher.lua' reaper/platform/linux/install.sh
          grep -q '"version": "2.1.1"' reaper/version.json
          grep -q -F "core.VERSION = '2.1.1'" reaper/lib/odium_package.lua

      - name: Validate JSON manifests
        run: python -m json.tool reaper/version.json >/dev/null

      - name: Validate POSIX installer syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n reaper/platform/linux/install.sh
          bash -n reaper/platform/macos/install.command

      - name: Parse PowerShell installer scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $failed = $false
          Get-ChildItem reaper -Recurse -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "PowerShell parse errors: $($_.FullName)" -ForegroundColor Red
              $errors | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }
            }
          }
          if ($failed) { throw 'PowerShell parse checks failed.' }

      - name: Verify pinned dependency hashes are present
        shell: bash
        run: |
          set -euo pipefail
          grep -q '0.10.0.5' reaper/tools/Fetch-ReaImGui.ps1
          grep -q '800b216e0937bf5bb6b08ba2767b7b974a746b3fc3b54943b4d3011da0a68f2a' reaper/tools/Fetch-ReaImGui.ps1
          grep -q 'b73dac959d973e2d8fb47ea73588e84f81d4a3c7fb962c327d08427c2454b093' reaper/tools/Fetch-ReaImGui.ps1
          grep -q 'db580001caa24ac104c8cb856cd113a87b0a443f7bdf47d8c12b1d740584a2ec' reaper/tools/Install-FFmpeg.ps1
